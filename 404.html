<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1e3a">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <title>Page Not Found · Forgewell Corporation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="assets/media/logo-2.svg">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      display:grid;place-items:center;min-height:100vh;margin:0;
      background:#08080c;color:#d4d0c8;
      font-family:"Nunito Sans",system-ui,-apple-system,sans-serif;
      text-align:center;padding:24px;
    }
    .card{
      max-width:560px;padding:56px 40px;
      background:#15151e;border:1px solid rgba(255,255,255,0.05);
      border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,0.6);
    }
    .code{
      color:#c8a84e;font-family:"Quicksand",sans-serif;
      font-size:clamp(4rem,10vw,6rem);font-weight:700;line-height:1;
      margin-bottom:8px;letter-spacing:-0.02em;
    }
    h1{
      margin:0 0 12px;font-family:"Quicksand",sans-serif;
      font-size:clamp(1.6rem,4vw,2.2rem);color:#f0ece0;
      font-weight:700;line-height:1.2;
    }
    h1::after{
      content:"";display:block;width:40px;height:2px;
      background:#c8a84e;margin:16px auto 0;
    }
    p{color:#9e9a92;font-size:17px;margin:0 0 32px;line-height:1.7}
    a.btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:14px 36px;background:#c8a84e;color:#08080c;
      border-radius:10px;font-family:"Quicksand",sans-serif;
      font-weight:700;font-size:15px;letter-spacing:0.02em;
      text-decoration:none;transition:all 0.3s cubic-bezier(.4,0,.2,1);
      box-shadow:0 4px 20px rgba(200,168,78,0.15);
    }
    a.btn:hover{
      background:#dbb85e;transform:translateY(-2px);
      box-shadow:0 8px 32px rgba(200,168,78,0.25);
    }
    @media(prefers-reduced-motion:reduce){
      *{transition-duration:0.01ms!important}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for has moved or no longer exists. Let's get you back to innovation.</p>
    <a class="btn" href="/">Back to Home</a>
  </main>
</body>
</html>
