<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trueprogress by Forgewell Corporation</title>
  <meta name="description" content="Trueprogress - Reset Password" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14124c" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/reset-password.css" />
  <script>
    (function() {
      try {
        var t = localStorage.getItem('tp_theme') || localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="assets/theme.js"></script>
  <script src="assets/dataProtection.js"></script>
</head>
<body>
  <div class="reset-wrapper">
    <!-- Auth Floating Theme Toggle -->
    <div class="auth-theme-toggle">
      <button class="theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Toggle Light / Dark Mode" title="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
    <div class="reset-card">
      <!-- Logo -->
      <a href="https://www.forgewellcorp.com/" class="reset-logo-link" title="Forgewell Corporation">
        <span class="reset-logo-wrapper">
          <span class="reset-logo-sizer">
            <img
              class="reset-logo-img"
              alt="Trueprogress"
              src="/trueprogress/assets/trueprogress_logo.png"
              onerror="this.onerror=null;this.src='assets/trueprogress_logo.png';"
            />
          </span>
        </span>
      </a>

      <!-- Heading -->
      <h2 class="reset-heading">Reset Password</h2>
      <p class="reset-subheading">Enter your email address and we'll send you an email with instructions to reset your password.</p>

      <!-- Form -->
      <form id="resetForm" onsubmit="return handleReset(event)">
        <div class="reset-fields">
          <div>
            <label for="email" class="reset-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="reset-input"
              required
              placeholder="name@company.com"
            />
          </div>

          <div class="reset-terms-row">
            <input
              type="checkbox"
              id="terms"
              class="reset-checkbox"
              required
            />
            <label for="terms" class="reset-terms-text">
              I accept the <a href="#">Terms and Conditions</a>
            </label>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="reset-btn">
          Send Reset Email
        </button>

        <!-- Back to Login -->
        <a id="backToLoginLink" href="/login" class="reset-back-link">Back to login</a>
      </form>
    </div>
  </div>

  <script>
    function handleReset(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const termsAccepted = document.getElementById('terms').checked;

      if (!email) {
        alert('Please enter your email.');
        return false;
      }
      if (!termsAccepted) {
        alert('Please accept the terms and conditions.');
        return false;
      }

      console.log('Password reset requested for:', email);
      alert('Password reset link has been sent to your email.');
      window.location.href = (window.location.pathname.includes('/trueprogress/') ? 'login.html' : '/login');
      return false;
    }
  </script>
</body>
</html>
