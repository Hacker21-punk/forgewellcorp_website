<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>Trueprogress by Forgewell Corporation</title>
  <meta name="description" content="Trueprogress - Reset Password" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="assets/trueprogress/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/trueprogress/reset-password.css" />
  <script>
    (function() {
      try {
        var t = localStorage.getItem('tp_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <script src="assets/trueprogress/theme.js"></script>
</head>
<body>
  <div class="reset-wrapper">
    <!-- Theme Toggle Button -->
    <button class="theme-toggle-btn auth-theme-toggle" id="themeToggleBtn" type="button" aria-label="Switch to Dark Mode" title="Switch to Dark Mode">
      <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="reset-card">
      <!-- Logo -->
      <a href="/" class="reset-logo-link">
        <span class="reset-logo-wrapper">
          <span class="reset-logo-sizer">
            <img
              class="reset-logo-img"
              alt="Trueprogress"
              src="assets/trueprogress/trueprogress_logo.png"
            />
          </span>
        </span>
      </a>

      <!-- Heading -->
      <h2 class="reset-heading">Reset Password</h2>
      <p class="reset-subheading">Enter your email address and we'll send you an email with instructions to reset your password.</p>

      <!-- Form -->
      <form id="resetForm" onsubmit="return handleReset(event)">
        <div class="reset-fields">
          <div>
            <label for="email" class="reset-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="reset-input"
              required
              placeholder="name@company.com"
            />
          </div>

          <div class="reset-terms-row">
            <input
              type="checkbox"
              id="terms"
              class="reset-checkbox"
              required
            />
            <label for="terms" class="reset-terms-text">
              I accept the <a href="#">Terms and Conditions</a>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="resetBtn" class="reset-btn">
          SUBMIT
        </button>

        <!-- Back to Login -->
        <div class="login-forgot-row" style="margin-top: 20px;">
          <a href="/login" class="reset-back-link">&larr; Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function handleReset(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const terms = document.getElementById('terms').checked;

      if (!terms) {
        alert('Please accept the Terms and Conditions.');
        return;
      }

      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      btn.innerText = 'SENDING...';

      setTimeout(() => {
        alert('If an account exists with ' + email + ', a password reset link has been sent.');
        btn.disabled = false;
        btn.innerText = 'SUBMIT';
        window.location.href = '/login';
      }, 1000);
    }
  </script>
</body>
</html>
