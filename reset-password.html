<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trueprogress by Forgewell Corporation</title>
  <meta name="description" content="Trueprogress - Reset Password" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#14124c" />
  <link rel="icon" href="assets/trueprogress/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/trueprogress/reset-password.css" />
</head>
<body>
  <div class="reset-wrapper">
    <div class="reset-card">
      <!-- Logo -->
      <a href="https://forgewellcorp-website-dnhu.vercel.app/" class="reset-logo-link">
        <span class="reset-logo-wrapper">
          <span class="reset-logo-sizer">
            <img
              class="reset-logo-img"
              alt="Trueprogress"
              src="assets/trueprogress/trueprogress_logo.png"
            />
          </span>
        </span>
      </a>

      <!-- Heading -->
      <h2 class="reset-heading">Reset Password</h2>
      <p class="reset-subheading">Enter your email address and we'll send you an email with instructions to reset your password.</p>

      <!-- Form -->
      <form id="resetForm" onsubmit="return handleReset(event)">
        <div class="reset-fields">
          <div>
            <label for="email" class="reset-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="reset-input"
              required
              placeholder="name@company.com"
            />
          </div>

          <div class="reset-terms-row">
            <input
              type="checkbox"
              id="terms"
              class="reset-checkbox"
              required
            />
            <label for="terms" class="reset-terms-text">
              I accept the <a href="#">Terms and Conditions</a>
            </label>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="reset-btn">
          Send Reset Email
        </button>

        <!-- Back to Login -->
        <a href="/login" class="reset-back-link">Back to login</a>
      </form>
    </div>
  </div>

  <script>
    function handleReset(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const termsAccepted = document.getElementById('terms').checked;

      if (!email) {
        alert('Please enter your email.');
        return false;
      }
      if (!termsAccepted) {
        alert('Please accept the terms and conditions.');
        return false;
      }

      console.log('Password reset requested for:', email);
      alert('Password reset link has been sent to your email.');
      window.location.href = '/login';
      return false;
    }
  </script>
</body>
</html>
