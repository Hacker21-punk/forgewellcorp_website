<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Karyalay Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: operations console — fixed left rail of modules, scrolling work area; rail becomes a drawer under 900px. Brand hue comes from the active company's logo. */
:root{
  --brand:#0f6b5c;
  --bg:#f1f4f3; --surface:#ffffff; --sunk:#e7ecea; --fg:#141a18; --muted:#566360; --line:#d3dbd8; --line-2:#e3e8e6;
  --accent:var(--brand); --accent-ink:#ffffff;
  --accent-soft:color-mix(in oklab, var(--brand) 11%, var(--surface));
  --accent-line:color-mix(in oklab, var(--brand) 35%, var(--line));
  --ok:#17733a; --ok-soft:#e1f2e6; --warn:#945600; --warn-soft:#fbeed6; --bad:#b0261a; --bad-soft:#fbe3df; --info:#2b5aa8; --info-soft:#e2eaf8;
  --side:#10201c; --side-fg:#d9e6e1; --side-muted:#8ea39c; --side-hi:color-mix(in oklab, var(--brand) 55%, #10201c);
  --paper:#ffffff; --ink:#111111; --ink-line:#3b3b3b;
  --f-ui:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r:8px; --shadow:0 1px 2px rgb(16 32 28 / .06), 0 8px 24px rgb(16 32 28 / .08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1311; --surface:#141c19; --sunk:#1a2420; --fg:#e4ece8; --muted:#97a7a1; --line:#2a3632; --line-2:#212c28;
  --accent:color-mix(in oklab, var(--brand) 62%, #ffffff); --accent-ink:#0d1311;
  --accent-soft:color-mix(in oklab, var(--brand) 22%, var(--surface));
  --accent-line:color-mix(in oklab, var(--brand) 45%, var(--line));
  --ok:#5cc583; --ok-soft:#163222; --warn:#e3a54a; --warn-soft:#33260f; --bad:#f07a6b; --bad-soft:#3a1915; --info:#8db2f2; --info-soft:#17243a;
  --side:#0a110f; --side-fg:#d9e6e1; --side-muted:#7e918a; --side-hi:color-mix(in oklab, var(--brand) 45%, #0a110f);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#141c19; --sunk:#1a2420; --fg:#e4ece8; --muted:#97a7a1; --line:#2a3632; --line-2:#212c28;
  --accent:color-mix(in oklab, var(--brand) 62%, #ffffff); --accent-ink:#0d1311;
  --accent-soft:color-mix(in oklab, var(--brand) 22%, var(--surface));
  --accent-line:color-mix(in oklab, var(--brand) 45%, var(--line));
  --ok:#5cc583; --ok-soft:#163222; --warn:#e3a54a; --warn-soft:#33260f; --bad:#f07a6b; --bad-soft:#3a1915; --info:#8db2f2; --info-soft:#17243a;
  --side:#0a110f; --side-fg:#d9e6e1; --side-muted:#7e918a; --side-hi:color-mix(in oklab, var(--brand) 45%, #0a110f);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:800}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px))}
.brandblk{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid rgb(255 255 255 / .08);margin-bottom:10px}
.brandlogo{width:38px;height:38px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--brand);font-weight:800}
.brandlogo img{width:100%;height:100%;object-fit:contain}
.brandname{font-weight:700;font-size:.95rem;line-height:1.2}
.brandsub{font-size:.72rem;color:var(--side-muted);text-transform:uppercase;letter-spacing:.06em}
.navg{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-fg);padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:.9rem}
.nav:hover{background:rgb(255 255 255 / .06)}
.nav.on{background:var(--side-hi);color:#fff;font-weight:600}
.nav .badge{margin-left:auto;background:#e5484d;color:#fff;font-size:.7rem;border-radius:99px;padding:0 6px;font-weight:700}
.sidefoot{margin-top:auto;border-top:1px solid rgb(255 255 255 / .08);padding:12px 8px 0;display:flex;gap:10px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--side-hi);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.sidefoot .who{min-width:0;flex:1}
.sidefoot .who b{display:block;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidefoot .who span{font-size:.72rem;color:var(--side-muted)}
.iconbtn{border:0;background:none;color:inherit;padding:6px;border-radius:6px;cursor:pointer;display:inline-grid;place-items:center}
.iconbtn:hover{background:rgb(127 127 127 / .14)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.topbar .crumb{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb small{color:var(--muted);font-weight:500}
.topbar .sp{flex:1}
.menubtn{display:none}
.bell{position:relative}
.bell b{position:absolute;top:0;right:0;background:var(--bad);color:#fff;font-size:.62rem;border-radius:99px;padding:0 4px;min-width:15px;text-align:center}
.fyTag{font-family:var(--f-num);font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
.main{padding-block:20px 80px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));max-width:1320px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:50;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:40}
  .menubtn{display:inline-grid}
}

/* page pieces */
.phead{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.phead p{color:var(--muted);margin-top:3px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn .ic{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h2,.card > .ch{margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--f-num);font-size:1.35rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.stat.bad b{color:var(--bad)}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:6px 14px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px;max-width:340px}
.filters label{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--accent-soft)}
.tbl .r{text-align:right}
.tbl td.r{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.tbl tfoot td{font-weight:700;background:var(--sunk)}
@media (max-width:700px){
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td,.tbl.cards tfoot{display:block;width:100%}
  .tbl.cards tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl.cards td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl.cards td::before{content:attr(data-label);color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;text-align:left;flex:none}
  .tbl.cards td.r{text-align:right}
  .tbl.cards .acts{justify-content:flex-end}
}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col header{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:700;font-size:.85rem;padding:2px 4px}
.col header span{color:var(--muted);font-weight:600}
.col header b{margin-left:auto;font-family:var(--f-num);font-size:.75rem;color:var(--muted);font-weight:500}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.lcard:hover{border-color:var(--accent-line)}
.lcard .t{font-weight:700;font-size:.88rem}
.lcard .row{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.lcard select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);font-size:.78rem}
/* reminders */
.rems{display:flex;flex-direction:column}
.rem{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);align-items:center}
.rem:last-child{border-bottom:0}
.rem .bar{align-self:stretch;border-radius:4px;background:var(--line)}
.rem.bad .bar{background:var(--bad)} .rem.warn .bar{background:var(--warn)} .rem.info .bar{background:var(--info)}
.rem .t{font-weight:600}
.rem .s{color:var(--muted);font-size:.82rem}
.rem .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.rem{grid-template-columns:4px minmax(0,1fr)}.rem .a{grid-column:2;justify-content:flex-start}}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:.84rem}
.barrow .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:99px}
.barrow .v{text-align:right;font-family:var(--f-num);font-size:.8rem}
/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.span{grid-column:1/-1}
.field > span{font-size:.76rem;font-weight:600;color:var(--muted)}
.field input:not([type=checkbox]),.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:72px;resize:vertical}
.field small{color:var(--muted);font-size:.74rem}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.fsec{grid-column:1/-1;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.permgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;grid-column:1/-1;background:var(--sunk);border-radius:var(--r);padding:12px}
.attach{display:flex;flex-direction:column;gap:8px}
.attach .chips{display:flex;flex-wrap:wrap;gap:6px}
.attach-btns{display:flex;gap:6px;flex-wrap:wrap}
.chip.file{background:var(--accent-soft);color:var(--fg);padding:0;overflow:hidden}
.chip.file button{border:0;background:none;padding:4px 8px;cursor:pointer;font-weight:600;font-size:.76rem;display:flex;gap:4px;align-items:center;max-width:220px}
.chip.file button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.file .x{padding:4px 7px;color:var(--muted);border-left:1px solid var(--line)}
.banks{display:flex;flex-direction:column;gap:10px;grid-column:1/-1}
.bankrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;background:var(--sunk);padding:10px;border-radius:var(--r);align-items:end}
/* doc editor */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:28px minmax(160px,2.2fr) minmax(70px,.8fr) 64px 64px minmax(80px,1fr) 56px 64px minmax(90px,1fr) 32px;gap:6px;align-items:end;background:var(--sunk);padding:8px;border-radius:7px}
.item label{display:flex;flex-direction:column;gap:3px;font-size:.68rem;color:var(--muted);font-weight:600;min-width:0}
.item input,.item select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 7px;width:100%;min-width:0;font-size:.85rem}
.item .sl{font-family:var(--f-num);color:var(--muted);padding-bottom:7px}
.item .amt{font-family:var(--f-num);text-align:right;padding-bottom:7px;font-weight:600}
.item .desc{grid-column:2/-2}
@media (max-width:980px){.item{grid-template-columns:repeat(4,minmax(0,1fr))}.item .sl{display:none}.item .pname,.item .desc{grid-column:1/-1}.item .amt{grid-column:span 2}}
.totals{display:grid;grid-template-columns:auto auto;gap:5px 24px;justify-content:end;font-size:.9rem}
.totals .num{text-align:right}
.totals .g{font-weight:800;font-size:1.05rem;border-top:1px solid var(--line);padding-top:6px}
.actionbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;box-shadow:var(--shadow)}
/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tli{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px}
.tli .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 3px var(--accent-soft)}
.tli .m{font-size:.76rem;color:var(--muted)}
/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pcard .img{aspect-ratio:16/10;background:var(--sunk);display:grid;place-items:center;color:var(--muted);max-width:100%}
.pcard .img img{width:100%;height:100%;object-fit:cover}
.pcard .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .b .row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:auto}
/* modal */
#modal,#viewer{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#viewer{z-index:80}
.mback{position:absolute;inset:0;background:rgb(8 14 12 / .55)}
.mbox{position:relative;background:var(--surface);border-radius:12px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.mbox.wide{width:min(1000px,100%)}
.mbox > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mbody{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunk)}
#mform{display:flex;flex-direction:column;min-height:0;flex:1}
.viewimg{max-width:100%;max-height:70vh;object-fit:contain;display:block;margin:0 auto;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:90;font-size:.86rem;max-width:calc(100% - 32px)}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login .art{background:var(--side);color:var(--side-fg);padding-block:48px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.login .art h1{font-size:2.3rem;line-height:1.1;color:#fff;max-width:14ch}
.login .art p{color:var(--side-muted);max-width:46ch;margin-top:12px}
.ledger{font-family:var(--f-num);font-size:.78rem;color:var(--side-muted);display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;max-width:440px;border-top:1px solid rgb(255 255 255 / .1);padding-top:16px}
.ledger b{color:#fff;font-weight:500}
.login .frm{display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.demo{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.demo button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:.82rem}
.demo button:hover{border-color:var(--accent-line)}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr)}.login .art{padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.login .art h1{font-size:1.7rem}.ledger{display:none}}
.cocard{display:flex;gap:12px;align-items:flex-start}
.cocard .brandlogo{border:1px solid var(--line);width:46px;height:46px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid var(--line)}
.paperwrap{overflow-x:auto;background:var(--sunk);border-radius:var(--r);padding:12px}
.note{background:var(--info-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px;font-size:.84rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ================= storage (IndexedDB, falls back to memory) ================= */
const MEMF={};
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('karyalay-portal',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('files')};r.onsuccess=()=>{IDB.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  get(st,k){return new Promise(res=>{if(!IDB.db)return res(st==='files'?MEMF[k]:null);try{const q=IDB.db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})},
  put(st,k,v){return new Promise(res=>{if(st==='files')MEMF[k]=v;if(!IDB.db)return res(false);try{const tx=IDB.db.transaction(st,'readwrite');tx.objectStore(st).put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})},
  clear(){return new Promise(res=>{if(!IDB.db)return res();try{const tx=IDB.db.transaction(['kv','files'],'readwrite');tx.objectStore('kv').clear();tx.objectStore('files').clear();tx.oncomplete=()=>res()}catch(e){res()}})}
};

function fyOf(iso,startM=4){const[y,m]=iso.split('-').map(Number);const s=m>=startM?y:y-1;return{full:`${s}-${String(s+1).slice(2)}`,short:`${String(s).slice(2)}-${String(s+1).slice(2)}`,start:s}}
function fmtNo(c,type,seq,iso){const n=c.numbering[type];const fy=fyOf(iso,c.fyStart||4);return String(n.format||'{PREFIX}/{FY}/{SEQ}').replace('{PREFIX}',n.prefix||'').replace('{FYS}',fy.short).replace('{FY}',fy.full).replace('{SEQ}',String(seq).padStart(+n.pad||1,'0'))}
function peekNo(c,type,iso){const fy=fyOf(iso,c.fyStart||4).full;const last=c.counters[type+'|'+fy];const seq=last!=null?last+1:(+c.numbering[type].start||1);return{seq,fy,no:fmtNo(c,type,seq,iso)}}
function takeNo(c,type,iso){const p=peekNo(c,type,iso);c.counters[type+'|'+p.fy]=p.seq;return p}

let DL;
async function getDL(){if(DL!==undefined)return DL;try{DL=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){DL=null}return DL}
async function saveFile(filename,data){const dl=window.claude?await getDL():null;if(!dl){try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Saved '+filename)}catch(e){toast('Could not save the file.')}return}try{await dl.save({filename,data});toast('Saved '+filename)}catch(e){const c=e&&e.code;if(c==='declined')return;toast(c==='rejected_extension'?'This file type can’t be downloaded here.':c==='rate_limited'?'A download prompt is already open.':'Could not save the file.')}}
async function xport(name,rows,sheets){
  if(!window.XLSX){toast('The Excel library didn’t load. Check your internet connection.');return}
  const wb=XLSX.utils.book_new();
  const add=(nm,rs)=>{if(!rs.length)rs=[{Note:'No records'}];const ws=XLSX.utils.json_to_sheet(rs);const keys=Object.keys(rs[0]);ws['!cols']=keys.map(k=>({wch:Math.min(48,Math.max(k.length,...rs.map(r=>String(r[k]??'').length))+2)}));XLSX.utils.book_append_sheet(wb,ws,nm.slice(0,31))};
  if(sheets) sheets.forEach(([n,r])=>add(n,r)); else { if(!rows.length){toast('Nothing to export with these filters.');return} add(name,rows) }
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const co=curCo();await saveFile(`${(co?co.name.split(' ')[0]+'_':'')}${name.replace(/\s+/g,'_')}_${T()}.xlsx`,new Blob([buf]));
}

/* ================= logo → theme ================= */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2hex(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function logoColor(blob){return new Promise(res=>{const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{try{const cv=document.createElement('canvas'),s=72;cv.width=s;cv.height=s;const x=cv.getContext('2d');x.drawImage(img,0,0,s,s);const d=x.getImageData(0,0,s,s).data;const bk={};
  for(let i=0;i<d.length;i+=4){if(d[i+3]<140)continue;const[h,sa,l]=rgb2hsl(d[i],d[i+1],d[i+2]);if(sa<.2||l>.9||l<.08)continue;const k=Math.round(h/12);const o=bk[k]||(bk[k]={w:0,h:0,s:0,l:0});const w=sa*(1-Math.abs(l-.5));o.w+=w;o.h+=h*w;o.s+=sa*w;o.l+=l*w}
  const best=Object.values(bk).sort((a,b)=>b.w-a.w)[0];if(!best){res(null);return}
  const h=best.h/best.w,sa=Math.max(.45,Math.min(.85,best.s/best.w)),l=Math.max(.27,Math.min(.4,best.l/best.w));res(hsl2hex(h,sa,l))}catch(e){res(null)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url})}
function applyTheme(){const c=curCo();document.documentElement.style.setProperty('--brand',(c&&c.brand)||'#0f6b5c')}

function field(f,v){
  if(f.t==='sec') return `<div class="fsec">${esc(f.l)}</div>`;
  if(f.t==='html') return f.html;
  const id='f_'+f.k, req=f.req?'required':'', val=v??f.def??'';
  if(f.t==='check') return `<label class="chk ${f.span?'field span':''}"><input type="checkbox" id="${id}" name="${f.k}" ${val===true||val==='true'?'checked':''}> ${esc(f.l)}</label>`;
  if(f.t==='files') return `<div class="field span"><span>${esc(f.l)}</span>${attachW(f.k,v,f.images)}${f.hint?`<small>${f.hint}</small>`:''}</div>`;
  let inp;
  if(f.t==='select') inp=`<select id="${id}" name="${f.k}" ${req} ${f.chg?`data-fchg="${f.chg}"`:''}>${f.blank===false?'':`<option value="">${esc(f.ph||'— Select —')}</option>`}${f.o.map(([a,b])=>`<option value="${esc(a)}" ${String(val)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else if(f.t==='textarea') inp=`<textarea id="${id}" name="${f.k}" ${req} placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="any"':''} value="${esc(val)}" ${req} placeholder="${esc(f.ph||'')}" ${f.ro?'readonly':''} ${f.chg?`data-fchg="${f.chg}"`:''}>`;
  return `<label class="field ${f.span?'span':''}"><span>${esc(f.l)}${f.req?' *':''}</span>${inp}${f.hint?`<small>${f.hint}</small>`:''}</label>`;
}

function formObj(fm){const o={};for(const el of fm.elements){if(!el.name||el.disabled)continue;let n=el.name;const arr=n.endsWith('[]');if(arr)n=n.slice(0,-2);let v;
  if(el.type==='checkbox'){if(el.dataset.multi!==undefined){o[n]=o[n]||[];if(el.checked)o[n].push(el.value);continue}v=el.checked}
  else if(el.type==='file')continue;

/* ================= business helpers ================= */
function custState(cu){return cu?(cu.gstin?cu.gstin.slice(0,2):cu.stateCode||''):''}
function calc(doc){
  const co=byId('companies',doc.companyId)||curCo(), cu=byId('customers',doc.customerId);
  const cs=custState(cu), intra=!cs||cs===(co.gstin||'').slice(0,2)||cs===co.stateCode;
  let taxable=0,tax=0,qty=0;const hs={};
  const lines=(doc.items||[]).map(it=>{const amt=r2((+it.qty||0)*(+it.rate||0)*(1-(+it.disc||0)/100));const t=r2(amt*(+it.gst||0)/100);taxable+=amt;tax+=t;qty+=(+it.qty||0);const k=(it.hsn||'—')+'|'+(+it.gst||0);const h=hs[k]||(hs[k]={hsn:it.hsn||'—',rate:+it.gst||0,taxable:0,tax:0});h.taxable+=amt;h.tax+=t;return{...it,amt,tax:t}});
  taxable=r2(taxable);tax=r2(tax);const gross=r2(taxable+tax),total=Math.round(gross);
  return{lines,taxable,tax,qty,intra,cgst:intra?r2(tax/2):0,sgst:intra?r2(tax-r2(tax/2)):0,igst:intra?0:tax,round:r2(total-gross),total,hsn:Object.values(hs)};
}
const docTotal=d=>calc(d).total;
const dueDate=d=>addDays(d.date,+d.creditDays||0);
function received(inv){return r2(sum(S.payments.filter(p=>p.invoiceId===inv.id),p=>(+p.amount||0)+(+p.tds||0)))}
function outstanding(inv){return r2(docTotal(inv)-received(inv))}
function payStatus(inv){const o=outstanding(inv),tot=docTotal(inv);if(o<=0.5)return['Paid','ok'];const od=dBetween(dueDate(inv),T());if(od>0)return[`Overdue ${od}d`,'bad'];if(od>=-7)return[od===0?'Due today':`Due in ${-od}d`,'warn'];return[o<tot?'Part paid':'Not due','info']}
function leadExpenses(lid){return C('expenses').filter(e=>e.leadId===lid&&e.status!=='Rejected')}
function custLeads(cid){return C('leads').filter(l=>l.customerId===cid)}
function waLink(phone,text){const d=String(phone||'').replace(/\D/g,'');if(d.length<10)return'';const n=d.length===10?'91'+d:d;return `https://wa.me/${n}?text=${encodeURIComponent(text)}`}

function payRemText(inv){const cu=byId('customers',inv.customerId)||{};const co=curCo();return `Dear ${cu.contact||'Sir/Madam'},\n\nThis is a gentle reminder that invoice ${inv.number} dated ${fd(inv.date)} for ${inr(docTotal(inv))} has an outstanding balance of ${inr(outstanding(inv))}, due on ${fd(dueDate(inv))}.\n\nKindly arrange the payment at the earliest. Please ignore if already paid.\n\nRegards,\n${me.name}\n${co.name}`}

/* ================= reminders engine ================= */
function reminders(){
  const out=[],t=T();
  if(can('pos')||can('pbg')) C('pos').forEach(p=>{
    const g=p.pbg||{};
    if(p.pbgRequired&&g.status==='Active'&&g.expiryDate){const dl=dBetween(t,g.expiryDate);const rd=+g.reminderDays||30;
      if(dl<=rd) out.push({sev:dl<=7?'bad':'warn',kind:'PBG',days:dl,title:`PBG ${g.number||''} ${dl<0?'expired':'expires'} ${dl<0?Math.abs(dl)+' days ago':dl===0?'today':'in '+dl+' days'}`,sub:`${g.format} · ${inr(g.amount)} · ${g.bank||''} · PO ${p.poNo} · ${custName(p.customerId)}`,open:['po',p.id]})}
    if(p.pbgRequired&&g.status==='Active'&&g.claimDate){const dl=dBetween(t,g.claimDate);if(dl>=0&&dl<=15&&dBetween(t,g.expiryDate)<0) out.push({sev:'warn',kind:'PBG',days:dl,title:`PBG claim period ends in ${dl} days`,sub:`PO ${p.poNo} · request release from ${custName(p.customerId)}`,open:['po',p.id]})}
    if(p.status!=='Delivered'&&p.status!=='Closed'&&p.deliveryDue){const dl=dBetween(t,p.deliveryDue);if(dl<=10) out.push({sev:dl<0?'bad':'warn',kind:'Delivery',days:dl,title:dl<0?`Delivery overdue by ${-dl} days`:`Delivery due ${dl===0?'today':'in '+dl+' days'}`,sub:`PO ${p.poNo} · ${custName(p.customerId)}${p.ldClause?' · LD '+p.ldClause:''}`,open:['po',p.id]})}
  });
  if(can('payments')||can('invoice')) C('docs').filter(d=>d.type==='invoice').forEach(inv=>{const o=outstanding(inv);if(o<=0.5)return;const dl=dBetween(t,dueDate(inv));if(dl<=7){const cu=byId('customers',inv.customerId)||{};out.push({sev:dl<0?'bad':'warn',kind:'Payment',days:dl,title:`${inr(o)} ${dl<0?'overdue by '+(-dl)+' days':dl===0?'due today':'due in '+dl+' days'}`,sub:`${inv.number} · ${cu.name||''}`,open:['payments',''],wa:waLink(cu.phone,payRemText(inv)),copy:payRemText(inv),pay:inv.id})}});
  if(can('leads')) visibleLeads().forEach(l=>{if(!l.nextFollowUp||['Won','Lost'].includes(l.stage))return;const dl=dBetween(t,l.nextFollowUp);if(dl<=1)out.push({sev:dl<0?'bad':dl===0?'warn':'info',kind:'Follow-up',days:dl,title:l.title,sub:`${l.contact||''} ${l.phone?'· '+l.phone:''} · ${dl<0?'missed by '+(-dl)+'d':dl===0?'today':'tomorrow'} · ${userName(l.owner)}`,open:['lead',l.id],wa:waLink(l.phone,fuText(l)),fu:l.id})});
  if(can('approve')){const pe=C('expenses').filter(e=>e.status==='Pending'),pa=C('advances').filter(a=>a.status==='Pending');
    if(pe.length)out.push({sev:'info',kind:'Approval',days:0,title:`${pe.length} expense claim${pe.length>1?'s':''} waiting for approval`,sub:inr(sum(pe,'amount'))+' in total',open:['expenses','']});
    if(pa.length)out.push({sev:'info',kind:'Approval',days:0,title:`${pa.length} advance request${pa.length>1?'s':''} waiting for approval`,sub:inr(sum(pa,'amount'))+' requested',open:['advances','']})}
  const rank={bad:0,warn:1,info:2};return out.sort((a,b)=>rank[a.sev]-rank[b.sev]||a.days-b.days);
}

function payCalc(e,days,lop){const f=days?Math.max(0,days-(+lop||0))/days:1;const rd=n=>Math.round((+n||0)*f);const basic=rd(e.basic),hra=rd(e.hra),spl=rd(e.special),oth=rd(e.other);const gross=basic+hra+spl+oth;const fullGross=(+e.basic||0)+(+e.hra||0)+(+e.special||0)+(+e.other||0);
  const pf=e.pf?Math.round(Math.min(basic,15000)*.12):0;const esi=e.esi&&fullGross<=21000?Math.ceil(gross*.0075):0;const pt=gross>0?(+e.pt||0):0;const tds=+e.tds||0;const ded=pf+esi+pt+tds;
  return{basic,hra,spl,oth,gross,pf,esi,pt,tds,ded,net:gross-ded,erPf:e.pf?Math.round(Math.min(basic,15000)*.12):0,erEsi:e.esi&&fullGross<=21000?Math.ceil(gross*.0325):0}}

function exportRows(k){const D=d=>fd(d);

  case 'customers':return C('customers').map(c=>{const s=custStats(c);return{Customer:c.name,Contact:c.contact,Mobile:c.phone,Email:c.email,GSTIN:c.gstin,PAN:c.pan,State:stateName(c.stateCode),'Credit days':c.creditDays,'Billed (₹)':s.billed,'Received (₹)':s.rec,'Outstanding (₹)':s.out,'Expenses (₹)':sum(s.ex,'amount')}});
  case 'pos':return C('pos').map(p=>({'PO no.':p.poNo,'PO date':D(p.poDate),Customer:custName(p.customerId),'Value (₹)':p.value,Status:p.status,'Delivery days':p.deliveryDays,'Delivery due':D(p.deliveryDue),'Payment terms':p.paymentTerms,'LD clause':p.ldClause,'PBG required':p.pbgRequired?'Yes':'No','PBG amount':p.pbgRequired?p.pbg.amount:'','PBG format':p.pbgRequired?p.pbg.format:'','PBG expiry':p.pbgRequired?D(p.pbg.expiryDate):'',Deliveries:(p.deliveries||[]).length}));
  case 'pbg':return C('pos').filter(p=>p.pbgRequired).map(p=>({'PO no.':p.poNo,Customer:custName(p.customerId),Format:p.pbg.format,'Issuing bank':p.pbg.bank,Number:p.pbg.number,'Amount (₹)':p.pbg.amount,'PBG date':D(p.pbg.issueDate),'Valid till':D(p.pbg.expiryDate),'Claim period ends':D(p.pbg.claimDate),'Days to expiry':p.pbg.expiryDate?dBetween(T(),p.pbg.expiryDate):'',Beneficiary:p.pbg.beneficiary,Status:p.pbg.status}));
  case 'quotation':case 'pi':case 'challan':case 'invoice':return C('docs').filter(d=>d.type===k).sort((a,b)=>a.date.localeCompare(b.date)).map(d=>{const c=calc(d),cu=byId('customers',d.customerId)||{};const r={Number:d.number,Date:D(d.date),Customer:cu.name,GSTIN:cu.gstin||'','Place of supply':stateName(custState(cu))};if(k==='challan')return{...r,'Total qty':c.qty,PO:d.buyerOrderNo};Object.assign(r,{'Taxable (₹)':c.taxable,'CGST (₹)':c.cgst,'SGST (₹)':c.sgst,'IGST (₹)':c.igst,'Round off':c.round,'Total (₹)':c.total});if(k==='invoice')Object.assign(r,{'Received (₹)':received(d),'Outstanding (₹)':outstanding(d),'Due date':D(dueDate(d)),Status:payStatus(d)[0]});if(k==='quotation')Object.assign(r,{Status:d.status,'Valid till':D(d.validTill)});return r});
  case 'hsnsum':{const m={};inv().forEach(d=>calc(d).hsn.forEach(h=>{const key=h.hsn+'|'+h.rate;const o=m[key]||(m[key]={'HSN/SAC':h.hsn,'GST %':h.rate,'Taxable (₹)':0,'Tax (₹)':0});o['Taxable (₹)']=r2(o['Taxable (₹)']+h.taxable);o['Tax (₹)']=r2(o['Tax (₹)']+h.tax)}));return Object.values(m)}
  case 'payments':return inv().map(d=>({Invoice:d.number,Date:D(d.date),Customer:custName(d.customerId),'Total (₹)':docTotal(d),'Received (₹)':received(d),'Outstanding (₹)':outstanding(d),'Due date':D(dueDate(d)),'Days overdue':Math.max(0,dBetween(dueDate(d),T())),Status:payStatus(d)[0]}));
  case 'expenses':return expScope().map(e=>({Date:D(e.date),Employee:userName(e.userId),Head:e.head,Lead:(byId('leads',e.leadId)||{}).title||'General',Customer:custName(e.customerId)||custName((byId('leads',e.leadId)||{}).customerId),Description:e.desc,'Petrol km':e.isPetrol?e.km:'','Rate/km':e.isPetrol?e.rate:'','Amount (₹)':e.amount,'Paid by':e.mode,Status:e.status,Bills:(e.files||[]).length}));
  case 'leadexp':return C('leads').map(l=>{const ex=leadExpenses(l.id);const o={Lead:l.title,Customer:custName(l.customerId)||l.company||'',Stage:l.stage,'Lead value (₹)':+l.value||0,'Total expenses (₹)':sum(ex,'amount')};(curCo().heads||[]).forEach(h=>{const v=sum(ex.filter(e=>e.head===h),'amount');if(v)o[h]=v});return o}).filter(r=>r['Total expenses (₹)']>0);
  case 'advances':return C('advances').map(a=>({Date:D(a.date),Employee:userName(a.userId),Purpose:a.purpose,Head:a.head,Lead:(byId('leads',a.leadId)||{}).title||'','Needed by':D(a.needBy),'Amount (₹)':a.amount,Status:a.status,'Approved by':userName(a.approvedBy)}));
  case 'purchases':return C('purchases').map(p=>({Date:D(p.date),Vendor:p.vendor,GSTIN:p.vendorGstin,'Bill no.':p.billNo,'Taxable (₹)':p.taxable,'GST (₹)':p.gstAmt,'Total (₹)':p.total,Head:p.head,Project:(byId('leads',p.leadId)||{}).title||'General',Status:p.status,'Paid on':D(p.paidOn),Notes:p.notes}));
  case 'products':return C('products').map(p=>({Type:p.type,Name:p.name,'HSN/SAC':p.hsn,Unit:p.unit,'Cost (₹)':p.cost,'Price (₹)':p.price,'GST %':p.gst,Description:p.desc}));
  case 'employees':return C('employees').map(e=>{const p=payCalc(e,30,0);return{Name:e.name,Designation:e.designation,'Date of joining':D(e.doj),PAN:e.pan,UAN:e.uan,'Bank A/c':e.bankAc,IFSC:e.ifsc,Basic:e.basic,HRA:e.hra,Special:e.special,Other:e.other,Gross:p.gross,PF:p.pf,ESI:p.esi,PT:p.pt,TDS:p.tds,'Net pay':p.net}});
  }return[]}

  if(!S||!S.companies){S=seed();save()}
  const sess=ls.get('karyalay.session');
  if(sess){me=S.users.find(u=>u.id===sess.u&&u.active)||null;ctx=me?(me.role==='super'?(sess.c||null):me.companyId):null;if(me&&me.role==='super'&&!ctx)ui.view='companies'}
  render();
})();
</script>
