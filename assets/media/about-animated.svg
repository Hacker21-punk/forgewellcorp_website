<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background: #060b14; border-radius: 16px; overflow: hidden;">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f2137" />
      <stop offset="55%" stop-color="#091322" />
      <stop offset="100%" stop-color="#04070d" />
    </radialGradient>

    <radialGradient id="lens-grad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#00b4d8" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#0b1b33" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030812" stop-opacity="0.95" />
    </radialGradient>

    <linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d690" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00d690" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00d690" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="line-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d690" stop-opacity="0" />
      <stop offset="50%" stop-color="#00d690" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00d690" stop-opacity="0" />
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d690" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="0" cy="0" r="1" fill="#00d690" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes rotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    @keyframes pulseTarget {
      0%, 100% { opacity: 0.2; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes blinkLED {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00d690); }
      50% { opacity: 0.2; }
    }
    @keyframes blinkAlert {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }
    @keyframes scanline {
      0% { transform: translateY(-340px); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes blip1 {
      0%, 15% { opacity: 0.15; }
      18% { opacity: 1; filter: drop-shadow(0 0 6px #00f5a0); }
      30% { opacity: 0.9; }
      60%, 100% { opacity: 0.2; }
    }
    @keyframes blip2 {
      0%, 45% { opacity: 0.15; }
      48% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      60% { opacity: 0.9; }
      90%, 100% { opacity: 0.2; }
    }
    @keyframes blip3 {
      0%, 75% { opacity: 0.15; }
      78% { opacity: 1; filter: drop-shadow(0 0 6px #00d690); }
      90% { opacity: 0.9; }
      100% { opacity: 0.2; }
    }
    @keyframes waveformShift {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes hexData {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }
    @keyframes lockBracket {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .rot-cw-fast { transform-origin: 400px 400px; animation: rotateCW 12s linear infinite; }
    .rot-cw-med { transform-origin: 400px 400px; animation: rotateCW 24s linear infinite; }
    .rot-cw-slow { transform-origin: 400px 400px; animation: rotateCW 48s linear infinite; }
    .rot-ccw-med { transform-origin: 400px 400px; animation: rotateCCW 20s linear infinite; }
    .rot-ccw-slow { transform-origin: 400px 400px; animation: rotateCCW 36s linear infinite; }
    .sweep { transform-origin: 400px 400px; animation: radarSweep 5s linear infinite; }
    .pulse-core { transform-origin: 400px 400px; animation: pulseGlow 3s ease-in-out infinite; }
    .scan-laser { transform-origin: 400px 400px; animation: scanline 4s linear infinite; }
    .led-blink { animation: blinkLED 1.2s infinite; }
    .target-box { transform-origin: 400px 400px; animation: lockBracket 2.4s ease-in-out infinite; }
    .b1 { animation: blip1 5s infinite; }
    .b2 { animation: blip2 5s infinite; }
    .b3 { animation: blip3 5s infinite; }
    .wave { stroke-dasharray: 8 4; animation: waveformShift 6s linear infinite; }
    .hex-pulse { animation: hexData 2s ease-in-out infinite; }
  </style>

  <!-- Deep Background & Tech Grid -->
  <rect width="800" height="800" fill="url(#bg-grad)" />
  <rect width="800" height="800" fill="url(#tech-grid)" />

  <!-- Radial Distance Rings (Range 1km - 4km) -->
  <g stroke="#00d690" stroke-opacity="0.12" fill="none" stroke-width="1">
    <circle cx="400" cy="400" r="350" />
    <circle cx="400" cy="400" r="280" stroke-dasharray="3 6" />
    <circle cx="400" cy="400" r="210" />
    <circle cx="400" cy="400" r="140" stroke-dasharray="2 4" />
    <circle cx="400" cy="400" r="70" />
  </g>

  <!-- Axis Crosshairs with Range Labels -->
  <g stroke="#00d690" stroke-opacity="0.2" stroke-width="1">
    <line x1="400" y1="30" x2="400" y2="770" stroke-dasharray="4 4" />
    <line x1="30" y1="400" x2="770" y2="400" stroke-dasharray="4 4" />
    <!-- Center Precision cross -->
    <line x1="390" y1="400" x2="410" y2="400" stroke="#00f5a0" stroke-width="2" />
    <line x1="400" y1="390" x2="400" y2="410" stroke="#00f5a0" stroke-width="2" />
  </g>

  <!-- Radar Scanning Sweep Sector (Rotating 360) -->
  <g class="sweep">
    <path d="M 400 400 L 750 400 A 350 350 0 0 0 647 152 Z" fill="url(#sweep-grad)" />
    <line x1="400" y1="400" x2="750" y2="400" stroke="#00f5a0" stroke-width="2" filter="url(#glow-green)" />
  </g>

  <!-- Detected Radar Targets / Blips -->
  <!-- Target 1: North-East 2.4km -->
  <g transform="translate(580, 240)" class="b1">
    <circle cx="0" cy="0" r="6" fill="#00f5a0" filter="url(#glow-green)" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00f5a0" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="20" y="4" font-family="'Courier New', monospace" font-size="10" fill="#00f5a0" font-weight="bold">TRK-A41 [2.4KM]</text>
  </g>

  <!-- Target 2: South-East 3.1km -->
  <g transform="translate(610, 560)" class="b2">
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
    <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    <text x="18" y="4" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" font-weight="bold">SYS-LIDAR [3.1KM]</text>
  </g>

  <!-- Target 3: North-West 1.8km -->
  <g transform="translate(250, 270)" class="b3">
    <circle cx="0" cy="0" r="5" fill="#00d690" filter="url(#glow-green)" />
    <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#00d690" stroke-width="1.2" />
    <text x="-95" y="4" font-family="'Courier New', monospace" font-size="10" fill="#00d690" font-weight="bold">TARGET-03 [LOCK]</text>
  </g>

  <!-- Rotating Dial Ring 1: Outer Compass Degrees (Slow CW) -->
  <g class="rot-cw-slow">
    <circle cx="400" cy="400" r="330" fill="none" stroke="#00d690" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 12" />
    <circle cx="400" cy="400" r="320" fill="none" stroke="#00d690" stroke-opacity="0.15" stroke-width="1" />
    <!-- Cardinal Compass Markers -->
    <text x="400" y="85" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00f5a0" font-weight="bold">000° N</text>
    <text x="720" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00f5a0" font-weight="bold">090° E</text>
    <text x="400" y="725" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00f5a0" font-weight="bold">180° S</text>
    <text x="80" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00f5a0" font-weight="bold">270° W</text>
  </g>

  <!-- Rotating Dial Ring 2: Tactical Ballistic Segments (Counter CW) -->
  <g class="rot-ccw-med">
    <circle cx="400" cy="400" r="260" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="16 32 4 16 64 24" />
    <circle cx="400" cy="400" r="248" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Rotating Dial Ring 3: Telemetry Geared Arc (Medium CW) -->
  <g class="rot-cw-med">
    <circle cx="400" cy="400" r="185" fill="none" stroke="#00d690" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="40 10 20 10 8 6 8 10" filter="url(#glow-green)" />
    <circle cx="400" cy="400" r="172" fill="none" stroke="#00d690" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 6" />
  </g>

  <!-- Center Optronic Turret / Sensor Aperture Core -->
  <circle cx="400" cy="400" r="120" fill="url(#lens-grad)" stroke="#00d690" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="400" cy="400" r="120" fill="none" stroke="#00f5a0" stroke-width="1" filter="url(#glow-green)" opacity="0.7" />

  <!-- Inner Iris Aperture Blades (Rotating Counter-CW Fast) -->
  <g class="rot-ccw-slow">
    <polygon points="400,320 440,360 400,400 360,360" fill="none" stroke="#00f5a0" stroke-opacity="0.4" stroke-width="1.5" />
    <polygon points="400,480 440,440 400,400 360,440" fill="none" stroke="#00f5a0" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="400" cy="400" r="60" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="10 10" />
  </g>

  <!-- Pulsing Central Optical Core -->
  <g class="pulse-core">
    <circle cx="400" cy="400" r="28" fill="#00d690" fill-opacity="0.2" filter="url(#soft-glow)" />
    <circle cx="400" cy="400" r="14" fill="#00f5a0" filter="url(#glow-green)" />
    <circle cx="400" cy="400" r="5" fill="#ffffff" />
  </g>

  <!-- Dynamic Targeting Bounding Box (Gimbal Tracking Center) -->
  <g class="target-box">
    <!-- Top-Left Bracket -->
    <path d="M 320 350 L 320 320 L 350 320" fill="none" stroke="#00f5a0" stroke-width="3" filter="url(#glow-green)" />
    <!-- Top-Right Bracket -->
    <path d="M 480 350 L 480 320 L 450 320" fill="none" stroke="#00f5a0" stroke-width="3" filter="url(#glow-green)" />
    <!-- Bottom-Left Bracket -->
    <path d="M 320 450 L 320 480 L 350 480" fill="none" stroke="#00f5a0" stroke-width="3" filter="url(#glow-green)" />
    <!-- Bottom-Right Bracket -->
    <path d="M 480 450 L 480 480 L 450 480" fill="none" stroke="#00f5a0" stroke-width="3" filter="url(#glow-green)" />
    
    <!-- Target HUD Coordinates -->
    <text x="400" y="308" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#00f5a0" letter-spacing="2" font-weight="bold">[ OPTRONIC EO/IR GIMBAL LOCK ]</text>
    <text x="400" y="504" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" letter-spacing="1">AZ: 142.8°  EL: +18.4°  DIST: 3.42KM</text>
  </g>

  <!-- Scanning Laser Bar (Moving Vertical) -->
  <g class="scan-laser">
    <line x1="80" y1="400" x2="720" y2="400" stroke="url(#line-grad-h)" stroke-width="2" filter="url(#glow-green)" />
  </g>

  <!-- ==================== HUD HEADER & TELEMETRY ==================== -->
  <!-- Corner Tech HUD Borders -->
  <g stroke="#00d690" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top Left -->
    <path d="M 25 55 L 25 25 L 55 25" />
    <line x1="25" y1="25" x2="40" y2="40" stroke-width="1" />
    <!-- Top Right -->
    <path d="M 745 25 L 775 25 L 775 55" />
    <!-- Bottom Left -->
    <path d="M 25 745 L 25 775 L 55 775" />
    <!-- Bottom Right -->
    <path d="M 745 775 L 775 775 L 775 745" />
  </g>

  <!-- Top Telemetry Bar -->
  <g transform="translate(60, 42)">
    <circle cx="6" cy="6" r="4" fill="#00f5a0" class="led-blink" />
    <text x="20" y="10" font-family="'Courier New', monospace" font-size="12" fill="#f8fafc" font-weight="bold" letter-spacing="1.5">FORGEWELL DEFENSE &amp; INDUSTRIAL TECH</text>
    <text x="20" y="24" font-family="'Courier New', monospace" font-size="9" fill="#00d690" opacity="0.8">SYS-ID: FW-CORP // SPEC: MIL-STD-810H // STATUS: OPERATIONAL</text>
  </g>

  <!-- Top Right System Specs -->
  <g transform="translate(560, 42)">
    <text x="180" y="10" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8" font-weight="bold">GEO: 23°15'N 77°24'E</text>
    <text x="180" y="24" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8">QUANTUM &amp; OPTICAL SENSING</text>
  </g>

  <!-- Left Side Telemetry Stack -->
  <g transform="translate(35, 140)" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" letter-spacing="0.5">
    <text x="0" y="0" fill="#00f5a0" font-weight="bold">► SENSORS ACTIVE</text>
    <text x="0" y="18">EO/IR CAM: <tspan fill="#38bdf8">1080P/60Hz</tspan></text>
    <text x="0" y="34">RADAR: <tspan fill="#00f5a0">PULSE-DOPPLER</tspan></text>
    <text x="0" y="50">LiDAR 3D: <tspan fill="#38bdf8">1.2M PTS/SEC</tspan></text>
    <text x="0" y="66">WAVELENGTH: <tspan fill="#e2e8f0">1550nm EYE-SAFE</tspan></text>
    <text x="0" y="82">QUANTUM CLOCK: <tspan fill="#00f5a0">LOCKED 10⁻¹³</tspan></text>

    <!-- Mini Progress bars -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="80" height="4" fill="#1e293b" rx="2" />
      <rect x="0" y="0" width="68" height="4" fill="#00f5a0" rx="2" />
      <text x="88" y="5" font-size="8" fill="#00f5a0">85%</text>

      <rect x="0" y="12" width="80" height="4" fill="#1e293b" rx="2" />
      <rect x="0" y="0" width="55" height="4" fill="#38bdf8" rx="2" transform="translate(0, 12)" />
      <text x="88" y="17" font-size="8" fill="#38bdf8">68%</text>
    </g>
  </g>

  <!-- Right Side Hex Stream / Channel Partners -->
  <g transform="translate(680, 140)" font-family="'Courier New', monospace" font-size="9" fill="#64748b" text-anchor="end" class="hex-pulse">
    <text x="80" y="0" fill="#00f5a0" font-weight="bold">DATA BUS // RF</text>
    <text x="80" y="18">0x7F 0x4B 0x9A 0x12</text>
    <text x="80" y="34">0x3C 0x8D 0x2E 0xFA</text>
    <text x="80" y="50">0x00 0xD6 0x90 0xFF</text>
    <text x="80" y="66">CH-01: TABOR SIG</text>
    <text x="80" y="82">CH-02: PICO TECH</text>
    <text x="80" y="98">CH-03: TRUEPROGRESS</text>
    <text x="80" y="114">STATUS: STREAMING</text>
  </g>

  <!-- Bottom Waveform Oscilloscope Display -->
  <g transform="translate(60, 690)">
    <!-- Signal Wave Grid Frame -->
    <rect x="0" y="0" width="280" height="55" fill="#050e1a" stroke="#00d690" stroke-opacity="0.3" stroke-width="1" rx="4" />
    <path d="M 0 28 L 280 28" stroke="#00d690" stroke-opacity="0.15" stroke-dasharray="2 2" />
    
    <!-- Animated Sine Oscilloscope Waveform -->
    <path class="wave" d="M 10 28 Q 30 5, 50 28 T 90 28 T 130 28 T 170 28 T 210 28 T 250 28 T 270 28" fill="none" stroke="#00f5a0" stroke-width="2" filter="url(#glow-green)" />
    <text x="12" y="14" font-family="'Courier New', monospace" font-size="8" fill="#00f5a0" font-weight="bold">RF SPECTRUM // 4.28 GHz</text>
    <text x="210" y="46" font-family="'Courier New', monospace" font-size="8" fill="#38bdf8">SNR: +38.4 dB</text>
  </g>

  <!-- Bottom Right Action / Telemetry -->
  <g transform="translate(480, 695)" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8">
    <text x="0" y="12" fill="#f8fafc" font-weight="bold">TARGET ACQUISITION: CONTINUOUS</text>
    <text x="0" y="28">FOV: 14.2° × 8.0° | FL: 1200mm | F/4.0</text>
    <text x="0" y="44" fill="#00d690">● TRUEPROGRESS TELEMETRY SYNCED</text>
  </g>
</svg>
