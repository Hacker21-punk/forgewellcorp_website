<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trueprogress by Forgewell Corporation</title>
  <meta name="description" content="Trueprogress - Login to your account" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />
  <meta name="theme-color" content="#14124c" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      height: 100%;
      width: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.87);
      background-color: #fafbfb;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      vertical-align: middle;
    }

    a {
      color: inherit;
      text-decoration: inherit;
    }

    /* ===== Login Page Layout ===== */
    .login-wrapper {
      min-height: 100vh;
      width: 100%;
      background-color: #60a5fa; /* Tailwind blue-400 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-section {
      height: 100vh;
      width: 100%;
    }

    .login-container {
      width: 100%;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
      padding-top: 3rem;
      padding-bottom: 3rem;
      height: 100%;
    }

    .login-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      height: 100%;
      color: #1f2937; /* gray-800 */
    }

    /* Left Column - Illustration */
    .login-illustration-col {
      width: 100%;
      margin-bottom: 3rem;
    }

    .login-illustration-col img {
      width: 100%;
    }

    /* Right Column - Form */
    .login-form-col {
      width: 100%;
    }

    /* ===== Logo ===== */
    .login-logo-link {
      display: inline-block;
      margin-bottom: 0.5rem;
      text-decoration: underline;
      text-decoration-color: rgba(20, 18, 76, 0.4);
      color: #14124c;
    }

    .login-logo-link:hover {
      text-decoration-color: inherit;
    }

    .login-logo-wrapper {
      display: inline-block;
      overflow: hidden;
      position: relative;
      max-width: 100%;
    }

    .login-logo-sizer {
      display: block;
      width: 250px;
      height: 40px;
      max-width: 100%;
      background: none;
      opacity: 1;
      border: 0;
      margin: 0;
      padding: 0;
    }

    .login-logo-img {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      box-sizing: border-box;
      padding: 0;
      border: none;
      margin: auto;
      display: block;
      width: 0;
      height: 0;
      min-width: 100%;
      max-width: 100%;
      min-height: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* ===== Heading ===== */
    .login-heading {
      font-size: 1.25rem;
      line-height: 1.75rem;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 1rem;
      margin-top: 0.75rem;
    }

    /* ===== Form Fields ===== */
    .login-fields {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-input {
      display: block;
      font-size: 0.875rem;
      line-height: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      width: 100%;
      border: 1px solid #e5e7eb;
      outline: none;
      font-family: inherit;
      color: #1f2937;
      background-color: #ffffff;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .login-input::placeholder {
      opacity: 1;
      color: #9ca3af;
    }

    .login-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.25);
    }

    /* ===== Submit Button ===== */
    .login-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.75rem;
      background-color: #2563eb; /* blue-600 */
      color: #ffffff;
      font-weight: 500;
      font-size: 0.875rem;
      line-height: 1.375;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 0.375rem;
      border: none;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      transition: background-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .login-btn:hover {
      background-color: #1d4ed8; /* blue-700 */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    .login-btn:focus {
      background-color: #1d4ed8;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      outline: none;
      ring: 0;
    }

    .login-btn:active {
      background-color: #1e40af; /* blue-800 */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    /* ===== Forgot Password ===== */
    .login-forgot-row {
      display: flex;
      align-items: flex-end;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    .login-forgot-row::before {
      content: "";
      flex: 1;
      border-top: 1px solid #d1d5db; /* gray-300 */
    }

    .login-forgot-link {
      color: #1f2937;
      font-size: 0.9375rem;
      text-decoration: none;
      padding: 0 0.5rem;
      transition: color 0.15s ease-in-out;
    }

    .login-forgot-link:hover {
      color: #111827;
      text-decoration: underline;
    }

    /* ===== Responsive: md (768px+) ===== */
    @media (min-width: 768px) {
      .login-illustration-col {
        width: 66.666667%; /* 8/12 */
        margin-bottom: 0;
      }

      .login-form-col {
        width: 66.666667%; /* 8/12 */
      }

      .login-container {
        max-width: 768px;
      }
    }

    /* ===== Responsive: lg (1024px+) ===== */
    @media (min-width: 1024px) {
      .login-illustration-col {
        width: 50%; /* 6/12 */
      }

      .login-form-col {
        width: 41.666667%; /* 5/12 */
        margin-left: 5rem; /* lg:ml-20 */
      }

      .login-container {
        max-width: 1024px;
      }
    }

    @media (min-width: 1280px) {
      .login-container {
        max-width: 1280px;
      }
    }
  </style>
</head>
<body>
  <div id="__next">
    <div class="login-wrapper">
      <section class="login-section">
        <div class="login-container">
          <div class="login-row">
            <!-- Left Column: Illustration -->
            <div class="login-illustration-col">
              <img
                src="assets/login_illustration.png"
                alt="Drone survey illustration"
              />
            </div>

            <!-- Right Column: Login Form -->
            <div class="login-form-col">
              <form id="loginForm" onsubmit="return handleLogin(event)">
                <!-- Logo -->
                <a href="index.html" class="login-logo-link">
                  <span class="login-logo-wrapper">
                    <span class="login-logo-sizer">
                      <img
                        class="login-logo-img"
                        alt="Trueprogress"
                        src="assets/trueprogress_logo.png"
                      />
                    </span>
                  </span>
                </a>

                <!-- Heading -->
                <p class="login-heading">Please login to your account</p>

                <!-- Input Fields -->
                <div class="login-fields">
                  <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Email Address"
                    class="login-input"
                    required
                    autocomplete="email"
                  />
                  <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Password"
                    class="login-input"
                    required
                    autocomplete="current-password"
                  />
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="login-btn" id="loginSubmitBtn">
                  SIGN IN
                </button>

                <!-- Forgot Password -->
                <div class="login-forgot-row">
                  <a href="reset-password.html" class="login-forgot-link">Forgot Password?</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        alert('Please fill in all fields.');
        return false;
      }

      // Redirect to index.html on successful form entry for demo purposes
      console.log('Login attempt:', { email });
      window.location.href = 'index.html';
      return false;
    }
  </script>
</body>
</html>
