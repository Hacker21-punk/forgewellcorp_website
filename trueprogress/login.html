<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trueprogress by Forgewell Corporation</title>
  <meta name="description" content="Trueprogress - Login to your account" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14124c" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/login.css" />
  <script>
    (function() {
      try {
        localStorage.setItem('tp_theme', 'light');
        document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <script src="assets/theme.js"></script>
</head>
<body>
  <div id="__next">
    <div class="login-wrapper">
      <section class="login-section">
        <div class="login-container">
          <div class="login-row">
            <!-- Left Column: Illustration -->
            <div class="login-illustration-col">
              <img
                src="assets/login_illustration.png"
                alt="Drone survey illustration"
              />
            </div>

            <!-- Right Column: Login Form -->
            <div class="login-form-col">
              <form id="loginForm" onsubmit="return handleLogin(event)">
                <!-- Logo -->
                <a href="https://forgewellcorp-website-dnhu.vercel.app/" class="login-logo-link">
                  <span class="login-logo-wrapper">
                    <span class="login-logo-sizer">
                      <img
                        class="login-logo-img"
                        alt="Trueprogress"
                        src="assets/trueprogress_logo.png"
                      />
                    </span>
                  </span>
                </a>

                <!-- Heading -->
                <h1 class="login-heading">Welcome Back</h1>
                <p class="login-subheading">Please login to your account to continue</p>

                <!-- Input Fields -->
                <div class="login-fields">
                  <div class="input-group">
                    <label class="input-label" for="loginEmail">EMAIL OR USER ID / PHONE</label>
                    <input
                      type="text"
                      id="loginEmail"
                      name="loginId"
                      placeholder="Email, Phone, or User ID"
                      class="login-input"
                      required
                      autocomplete="username"
                    />
                  </div>
                  <div class="input-group">
                    <label class="input-label" for="loginPassword">PASSWORD</label>
                    <input
                      type="password"
                      id="loginPassword"
                      name="password"
                      placeholder="••••••••"
                      class="login-input"
                      required
                      autocomplete="current-password"
                    />
                  </div>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="login-btn" id="loginSubmitBtn">
                  SIGN IN
                </button>

                <!-- Forgot Password -->
                <div class="login-forgot-row">
                  <a href="reset-password.html" class="login-forgot-link">Forgot Password?</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // Automatically redirect if already logged in
    const existingUser = sessionStorage.getItem('loggedInUser') || localStorage.getItem('loggedInUser');
    if (existingUser) {
      try {
        const parsed = JSON.parse(existingUser);
        if (parsed && (parsed.uid || parsed.email)) {
          window.location.href = '/dashboard';
        }
      } catch (e) {}
    }

    async function handleLogin(event) {
      event.preventDefault();
      const rawInput = document.getElementById('loginEmail').value.trim();
      const loginId = rawInput.toLowerCase();
      const loginDigits = rawInput.replace(/\D/g, '');
      const passwordInput = document.getElementById('loginPassword').value;

      const btn = document.getElementById('loginSubmitBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'SIGNING IN...';
      }

      try {
        let response = null;
        const userUrls = [
          'backup%20details%20of%20trueprogress/users.json',
          '/backup%20details%20of%20trueprogress/users.json',
          'trueprogress/backup%20details%20of%20trueprogress/users.json',
          '/trueprogress/backup%20details%20of%20trueprogress/users.json'
        ];
        for (const u of userUrls) {
          try {
            const r = await fetch(u);
            if (r.ok) {
              response = r;
              break;
            }
          } catch(e) {}
        }
        if (!response || !response.ok) throw new Error('Failed to load user database');
        let users = await response.json();

        // Integrate custom, edited, and deleted users from safe storage
        const customUsers = (window.TPStorage && window.TPStorage.get('custom_users', [])) || JSON.parse(localStorage.getItem('custom_users') || '[]');
        const editedUsers = (window.TPStorage && window.TPStorage.get('edited_users', [])) || JSON.parse(localStorage.getItem('edited_users') || '[]');
        const deletedUsers = (window.TPStorage && window.TPStorage.get('deleted_users', [])) || JSON.parse(localStorage.getItem('deleted_users') || '[]');

        // Filter out deleted users
        users = users.filter(u => !deletedUsers.includes(u.uid));

        // Merge edited users
        editedUsers.forEach(edited => {
          if (deletedUsers.includes(edited.uid)) return;
          const idx = users.findIndex(u => u.uid === edited.uid);
          if (idx > -1) {
            users[idx] = { ...users[idx], ...edited };
          } else {
            users.push(edited);
          }
        });

        // Merge custom created users
        customUsers.forEach(custom => {
          if (deletedUsers.includes(custom.uid)) return;
          const idx = users.findIndex(u => u.uid === custom.uid);
          if (idx > -1) {
            users[idx] = { ...users[idx], ...custom };
          } else {
            users.push(custom);
          }
        });

        // Match user by Email, Email prefix, Phone number, Full Name, or UID
        const user = users.find(u => {
          const userEmail = (u.email || '').trim().replace(/\u00a0/g, '').toLowerCase();
          const emailPrefix = userEmail.split('@')[0];
          const userPhone = (u.phoneNumber || '').toString().replace(/\D/g, '');
          const userName = (u.name || '').trim().toLowerCase();
          const userUid = (u.uid || '').trim().toLowerCase();

          const idMatches = (
            userEmail === loginId ||
            (emailPrefix && emailPrefix === loginId) ||
            (userPhone && loginDigits && userPhone === loginDigits) ||
            (userName && userName === loginId) ||
            (userUid && userUid === loginId)
          );

          if (!idMatches) return false;

          const dbPass = (u.password !== undefined && u.password !== null) ? String(u.password) : '';
          const passMatches = (
            dbPass === passwordInput ||
            dbPass.trim() === passwordInput.trim() ||
            dbPass.toLowerCase() === passwordInput.toLowerCase()
          );

          return passMatches;
        });

        if (user) {
          if (user.status === 'Disable') {
            alert('This account has been disabled. Please contact the administrator.');
            if (btn) {
              btn.disabled = false;
              btn.innerText = 'SIGN IN';
            }
            return false;
          }

          sessionStorage.setItem('loggedInUser', JSON.stringify(user));
          localStorage.setItem('loggedInUser', JSON.stringify(user));
          window.location.href = '/dashboard';
        } else {
          alert('Invalid ID/Email or password.');
          if (btn) {
            btn.disabled = false;
            btn.innerText = 'SIGN IN';
          }
        }
      } catch (error) {
        console.error('Sign in error:', error);
        alert('An error occurred during sign in. Please try again.');
        if (btn) {
          btn.disabled = false;
          btn.innerText = 'SIGN IN';
        }
      }
      return false;
    }
  </script>
</body>
</html>
