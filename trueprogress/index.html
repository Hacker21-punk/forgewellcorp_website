  <script>
    let surveysList = [];
    let currentUser = null;
    let allVideos = [];
    let allUsers = [];
    let surveyUserMap = {};

    // Active Column Filters State
    let activeFilters = {
      name: '',
      department: '',
      survey_length: '',
      video_count: '',
      user_count: '',
      status: ''
    };

    // Verify session
    const userSession = sessionStorage.getItem('loggedInUser');
    if (!userSession) {
      window.location.href = 'login.html';
    } else {
      currentUser = JSON.parse(userSession);
      
      function getInitials(name) {
        if (!name) return '';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      
      // Update UI Header details
      document.getElementById('profileName').innerText = getInitials(currentUser.name);

      // Update Dropdown details
      document.getElementById('dropdownName').innerText = currentUser.name;
      document.getElementById('dropdownPhone').innerText = currentUser.phoneNumber || 'N/A';
      document.getElementById('dropdownEmail').innerText = currentUser.email || 'N/A';

      if (currentUser.admin === "true") {
        document.getElementById('dropdownRole').innerText = "Admin";
        document.getElementById('adminDropdownOptions').style.display = "block";
        document.getElementById('adminControls').style.display = "block";
        document.getElementById('actionHeader').style.display = "table-cell";
      } else {
        document.getElementById('dropdownRole').innerText = "User";
      }

      // Initialize App
      initializeApp();
    }

    async function initializeApp() {
      await fetchSurveys();
      await fetchVideos();
      await fetchUsers();
      buildSurveyUserMap();
      renderSurveysTable();
    }

    // Fetch surveys from surveys.json and local storage overrides
    async function fetchSurveys() {
      try {
        const response = await fetch('backup%20details%20of%20trueprogress/surveys.json');
        if (!response.ok) throw new Error('Failed to load surveys data');
        const defaultSurveys = await response.json();

        // Get custom surveys from localStorage
        const customSurveysStr = localStorage.getItem('custom_surveys');
        const deletedSurveysStr = localStorage.getItem('deleted_surveys');

        const customSurveys = customSurveysStr ? JSON.parse(customSurveysStr) : [];
        const deletedSurveys = deletedSurveysStr ? JSON.parse(deletedSurveysStr) : [];

        // Apply edits / deletions to default list
        const editedSurveysStr = localStorage.getItem('edited_surveys');
        const editedSurveys = editedSurveysStr ? JSON.parse(editedSurveysStr) : [];

        surveysList = defaultSurveys.filter(s => !deletedSurveys.includes(s.id));

        // Merge edited details
        surveysList = surveysList.map(s => {
          const edited = editedSurveys.find(e => e.id === s.id);
          return edited ? { ...s, ...edited } : s;
        });

        // Add completely new custom ones
        surveysList = [...surveysList, ...customSurveys];
      } catch (error) {
        console.error(error);
        alert('Error fetching surveys database.');
      }
    }

    // Fetch videos list
    async function fetchVideos() {
      try {
        const response = await fetch('backup%20details%20of%20trueprogress/videos.json');
        if (!response.ok) throw new Error('Failed to load videos data');
        allVideos = await response.json();
      } catch (error) {
        console.error('Error fetching videos:', error);
      }
    }

    // Fetch all users
    async function fetchUsers() {
      try {
        const response = await fetch('backup%20details%20of%20trueprogress/users.json');
        if (!response.ok) throw new Error('Failed to load users data');
        allUsers = await response.json();
      } catch (error) {
        console.error('Error fetching users:', error);
      }
    }

    // Build a map of survey name -> list of user names who have access
    function buildSurveyUserMap() {
      surveyUserMap = {};
      surveysList.forEach(survey => {
        const surveyNameLower = survey.name.trim().toLowerCase();
        const matchingUserNames = [];
        allUsers.forEach(user => {
          if (user.survey && Array.isArray(user.survey)) {
            const hasAccess = user.survey.some(s => s.trim().toLowerCase() === surveyNameLower);
            if (hasAccess) {
              matchingUserNames.push(user.name);
            }
          }
        });
        surveyUserMap[survey.id] = matchingUserNames;
      });
    }

        headersHtml = `

              <div class="header-content" onclick="toggleFilterPopover(event, 'name')">
                Name
                <svg id="filter-icon-name" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path></svg>
              </div>
            </th>
            <th>
              <div class="header-content" onclick="toggleFilterPopover(event, 'department')">
                Department
                <svg id="filter-icon-department" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path></svg>
              </div>
            </th>
            <th>
              <div class="header-content" onclick="toggleFilterPopover(event, 'video_count')">
                Video Count
                <svg id="filter-icon-video_count" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path></svg>
              </div>
            </th>
            <th>
              <div class="header-content" onclick="toggleFilterPopover(event, 'survey_length')">
                Survey Length
                <svg id="filter-icon-survey_length" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path></svg>
              </div>
            </th>
            <th>Created On</th>
            <th>
              <div class="header-content" onclick="toggleFilterPopover(event, 'status')">
                Status
                <svg id="filter-icon-status" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path></svg>

      }
      thead.innerHTML = headersHtml;
    }

    function renderSurveysTable() {
      // Render the table header dynamically
      renderTableHeader();

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      // Filter surveys based on user access and active filters
      const allowedSurveys = surveysList.filter(survey => {
        // 1. User Access check
        if (currentUser.admin !== "true") {
          const wildcardAccess = currentUser.survey && currentUser.survey.map(s => s.trim()).includes('*');
          if (!wildcardAccess) {
            const hasAccess = currentUser.survey && currentUser.survey.map(s => s.trim().toLowerCase()).includes(survey.name.trim().toLowerCase());
            if (!hasAccess) return false;
          }
        }

        // 2. Column Search filters
        if (activeFilters.name && !survey.name.toLowerCase().includes(activeFilters.name.toLowerCase())) {
          return false;
        }
        if (activeFilters.department && !survey.department.toLowerCase().includes(activeFilters.department.toLowerCase())) {
          return false;
        }
        if (activeFilters.survey_length && !(survey.survey_length || '').toLowerCase().includes(activeFilters.survey_length.toLowerCase())) {
          return false;
        }

        // Video Count calculation
        const matchingVideos = allVideos.filter(v => v.survey === survey.id);
        const videoCount = matchingVideos.length > 0 ? matchingVideos.length : (survey.video_count !== undefined ? survey.video_count : (survey.total_surveys || 0));
        if (activeFilters.video_count && !String(videoCount).includes(activeFilters.video_count)) {
          return false;
        }

        // User Count calculation (dynamic from users.json)
        const dynamicUsers = surveyUserMap[survey.id] || [];
        const userCountNum = dynamicUsers.length;
        if (activeFilters.user_count && !String(userCountNum).includes(activeFilters.user_count)) {
          return false;
        }

        // Status calculation
        if (activeFilters.status && !survey.status.toLowerCase().includes(activeFilters.status.toLowerCase())) {
          return false;
        }

        return true;
      });

      // Sort alphabetically by name to match the original site
      allowedSurveys.sort((a, b) => a.name.localeCompare(b.name));

      // Style active filter icons
      Object.keys(activeFilters).forEach(col => {
        const icon = document.getElementById(`filter-icon-${col}`);
        if (icon) {
          if (activeFilters[col]) {
            icon.classList.add('active-filter-icon');
          } else {
            icon.classList.remove('active-filter-icon');
          }
        }
      });

      if (allowedSurveys.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="${currentUser.admin === 'true' ? '8' : '6'}" style="text-align: center; color: #9ca3af; padding: 2rem;">No authorized surveys found for your account.</td></tr>`;
        return;
      }

      allowedSurveys.forEach(survey => {
        const row = document.createElement('tr');
        row.id = `survey-row-${survey.id}`;
        
        const nameCell = `<td><a class="survey-link-name" href="survey.html?id=${survey.id}&name=${encodeURIComponent(survey.name)}">${escapeHtml(survey.name)}</a></td>`;
        const deptCell = `<td>${escapeHtml(survey.department)}</td>`;
        const lengthCell = `<td>${escapeHtml(survey.survey_length || '')}</td>`;

        // Video Count
        const matchingVideos = allVideos.filter(v => v.survey === survey.id);
        const videoCount = matchingVideos.length > 0 ? matchingVideos.length : (survey.video_count !== undefined ? survey.video_count : (survey.total_surveys || 0));
        const videoCell = `<td>${videoCount}</td>`;

        // User count with popover click event (dynamic from users.json)
        const dynamicUserNames = surveyUserMap[survey.id] || [];
        let userCell = `<td>N/A</td>`;
        if (dynamicUserNames.length > 0) {
          const namesData = JSON.stringify(dynamicUserNames).replace(/"/g, '&quot;');
          userCell = `<td><span class="user-count-clickable" onclick="showUsersPopover(event, ${namesData})">${dynamicUserNames.length} Users</span></td>`;
        } else if (dynamicUserNames.length === 0 && allUsers.length > 0) {
          userCell = `<td>0 Users</td>`;
        }
        
        // Format Created On date to M/D/YYYY
        let createdOn = survey.createdAt || 'N/A';
        if (typeof createdOn === 'number') {
          const date = new Date(createdOn);
          createdOn = `${date.getMonth() + 1}/${date.getDate()}/${date.getFullYear()}`;
        } else if (typeof createdOn === 'object' && createdOn.seconds) {
          const date = new Date(createdOn.seconds * 1000);
          createdOn = `${date.getMonth() + 1}/${date.getDate()}/${date.getFullYear()}`;
        } else if (typeof createdOn === 'string' && createdOn !== 'N/A') {
          let date;
          if (/^\d{4}-\d{2}-\d{2}$/.test(createdOn)) {
            date = new Date(createdOn + 'T00:00:00');
          } else {
            date = new Date(createdOn);
          }
          if (!isNaN(date.getTime())) {
            createdOn = `${date.getMonth() + 1}/${date.getDate()}/${date.getFullYear()}`;
          }
        }
        const dateCell = `<td>${createdOn}</td>`;
        const statusCell = `<td><span class="status-badge ${survey.status}">${survey.status}</span></td>`;

        let actionCell = '';
        if (currentUser.admin === "true") {
          actionCell = `
            <td>
              <div class="action-btn-group">
                <button class="action-icon-btn edit" onclick="openEditSurveyModal('${survey.id}')">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button class="action-icon-btn delete" onclick="handleDeleteSurvey('${survey.id}')">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          `;
        }

        if (currentUser.admin === "true") {
          row.innerHTML = nameCell + deptCell + lengthCell + videoCell + userCell + dateCell + statusCell + actionCell;
        } else {
          row.innerHTML = nameCell + deptCell + videoCell + lengthCell + dateCell + statusCell;
        }
        tableBody.appendChild(row);
      });
    }

    // Toggle Filter Popover
    function toggleFilterPopover(event, column) {
      event.stopPropagation();
      let popover = document.getElementById('filterPopover');
      if (!popover) {
        popover = document.createElement('div');
        popover.id = 'filterPopover';
        popover.className = 'filter-popover';
        document.body.appendChild(popover);
      }

      // Close other popovers
      closeUsersPopover();

      // If clicking same column filter, close it
      if (popover.style.display === 'flex' && popover.dataset.column === column) {
        popover.style.display = 'none';
        return;
      }

      popover.dataset.column = column;
      popover.innerHTML = `
        <input type="text" id="filterInput" placeholder="Filter ${column.replace('_', ' ')}..." value="${escapeHtml(activeFilters[column])}" />
        <div class="filter-popover-footer">
          <button class="btn-filter-clear" onclick="clearColumnFilter('${column}')">Clear</button>
          <button class="btn-filter-apply" onclick="applyColumnFilter('${column}')">Apply</button>
        </div>
      `;

      // Position Popover below header
      popover.style.display = 'flex';
      popover.style.flexDirection = 'column';
      
      const rect = event.currentTarget.getBoundingClientRect();
      const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

      popover.style.left = `${rect.left + scrollLeft}px`;
      popover.style.top = `${rect.bottom + scrollTop + 4}px`;

      // Focus input
      const input = document.getElementById('filterInput');
      input.focus();

      // Trigger apply on Enter key
      input.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
          applyColumnFilter(column);
        }
      });

      // Prevent closing popover when clicking inside it
      popover.onmousedown = (e) => e.stopPropagation();
    }

    function applyColumnFilter(column) {
      const val = document.getElementById('filterInput').value.trim();
      activeFilters[column] = val;
      renderSurveysTable();
      closeFilterPopover();
    }

    function clearColumnFilter(column) {
      activeFilters[column] = '';
      renderSurveysTable();
      closeFilterPopover();
    }

    function closeFilterPopover() {
      const popover = document.getElementById('filterPopover');
      if (popover) {
        popover.style.display = 'none';
      }
    }

    // Show Users Popover
    function showUsersPopover(event, userNames) {
      event.stopPropagation();
      let popover = document.getElementById('usersPopover');
      if (!popover) {
        popover = document.createElement('div');
        popover.id = 'usersPopover';
        popover.className = 'users-popover';
        document.body.appendChild(popover);
      }

      // Close filters popover
      closeFilterPopover();

      if (userNames.length === 0) return;

      let listHtml = '';
      userNames.forEach((name, idx) => {
        listHtml += `<li class="users-popover-item">${idx + 1}. - ${escapeHtml(name)}</li>`;
      });

      popover.innerHTML = `
        <div class="users-popover-title">${userNames.length} Users in this survey</div>
        <ul class="users-popover-list">
          ${listHtml}
        </ul>
      `;

      popover.style.display = 'block';

      // Position the popover near the clicked cell
      const rect = event.target.getBoundingClientRect();
      const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

      popover.style.left = `${rect.left + scrollLeft - 50}px`;
      popover.style.top = `${rect.bottom + scrollTop + 8}px`;

      // Prevent closing when clicking inside popover
      popover.onmousedown = (e) => e.stopPropagation();
    }

    function closeUsersPopover() {
      const popover = document.getElementById('usersPopover');
      if (popover) {
        popover.style.display = 'none';
      }
    }

    // Global listener to close popovers on click outside
    document.addEventListener('mousedown', () => {
      closeFilterPopover();
      closeUsersPopover();
    });

    // Modal Control: Create / Edit
    const surveyModal = document.getElementById('surveyModal');
    const openCreateSurveyModalBtn = document.getElementById('openCreateSurveyModalBtn');

    if (openCreateSurveyModalBtn) {
      openCreateSurveyModalBtn.addEventListener('click', () => {
        document.getElementById('modalTitle').innerText = "Create a survey";
        document.getElementById('editSurveyId').value = "";
        document.getElementById('surveyForm').reset();
        document.getElementById('saveSurveyBtn').innerText = "Create";
        
        // Default today's date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('surveyDateInput').value = today;

        surveyModal.classList.add('show');
      });
    }

    function closeSurveyModal() {
      surveyModal.classList.remove('show');
    }

    function openEditSurveyModal(id) {
      const survey = surveysList.find(s => s.id === id);
      if (!survey) return;

      document.getElementById('modalTitle').innerText = "Edit survey";
      document.getElementById('editSurveyId').value = survey.id;
      document.getElementById('surveyNameInput').value = survey.name;
      document.getElementById('surveyDeptInput').value = survey.department;
      document.getElementById('surveyLengthInput').value = survey.survey_length || '';
      document.getElementById('saveSurveyBtn').innerText = "Save";

      let createdOn = survey.createdAt || '';
      if (createdOn && typeof createdOn === 'object' && createdOn.seconds) {
        const date = new Date(createdOn.seconds * 1000);
        createdOn = date.toISOString().split('T')[0];
      }
      document.getElementById('surveyDateInput').value = createdOn;

      const radios = document.getElementsByName('surveyStatus');
      for (let radio of radios) {
        if (radio.value === survey.status) {
          radio.checked = true;
        }
      }

      surveyModal.classList.add('show');
    }

    async function handleSaveSurvey(event) {
      event.preventDefault();
      const id = document.getElementById('editSurveyId').value;
      const name = document.getElementById('surveyNameInput').value;
      const department = document.getElementById('surveyDeptInput').value;
      const survey_length = document.getElementById('surveyLengthInput').value;
      const createdAt = document.getElementById('surveyDateInput').value;
      
      const radios = document.getElementsByName('surveyStatus');
      let status = 'active';
      for (let r of radios) {
        if (r.checked) status = r.value;
      }

      if (id) {
        // Edit Survey
        let editedSurveys = JSON.parse(localStorage.getItem('edited_surveys') || '[]');
        const existingIdx = editedSurveys.findIndex(e => e.id === id);
        
        const surveyUpdate = { id, name, department, survey_length, createdAt, status };
        if (existingIdx > -1) {
          editedSurveys[existingIdx] = surveyUpdate;
        } else {
          editedSurveys.push(surveyUpdate);
        }
        localStorage.setItem('edited_surveys', JSON.stringify(editedSurveys));
      } else {
        // Create Survey
        const newSurvey = {
          id: 'custom-' + Math.random().toString(36).substring(2, 10),
          name,
          department,
          survey_length,
          createdAt,
          status,
          video_count: 0,
          user_count: []
        };
        let customSurveys = JSON.parse(localStorage.getItem('custom_surveys') || '[]');
        customSurveys.push(newSurvey);
        localStorage.setItem('custom_surveys', JSON.stringify(customSurveys));
      }

      closeSurveyModal();
      await fetchSurveys();
      buildSurveyUserMap();
      renderSurveysTable();
    }

    async function handleDeleteSurvey(id) {
      if (confirm('Are you sure you want to delete this survey?')) {
        let deletedSurveys = JSON.parse(localStorage.getItem('deleted_surveys') || '[]');
        
        if (id.startsWith('custom-')) {
          let customSurveys = JSON.parse(localStorage.getItem('custom_surveys') || '[]');
          customSurveys = customSurveys.filter(s => s.id !== id);
          localStorage.setItem('custom_surveys', JSON.stringify(customSurveys));
        } else {
          deletedSurveys.push(id);
          localStorage.setItem('deleted_surveys', JSON.stringify(deletedSurveys));
        }

        await fetchSurveys();
        buildSurveyUserMap();
        renderSurveysTable();
      }
    }

    // Modal Control: All Users
    const usersModal = document.getElementById('usersModal');
    
    document.getElementById('allUsersBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('backup%20details%20of%20trueprogress/users.json');
        if (!response.ok) throw new Error('Failed to fetch users list');
        const users = await response.json();

        const tableBody = document.getElementById('usersTableBody');
        tableBody.innerHTML = '';

        users.forEach((user, idx) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${idx + 1}</td>
            <td><strong>${escapeHtml(user.name || 'N/A')}</strong></td>
            <td>${escapeHtml(user.email || 'N/A')}</td>
            <td>${escapeHtml(user.phoneNumber || 'N/A')}</td>
            <td>${escapeHtml(user.organization || 'N/A')}</td>
            <td>${escapeHtml(user.department || 'N/A')}</td>
            <td><span style="font-weight: 700; color: ${user.admin === 'true' ? '#b45309' : '#047857'}">${user.admin === 'true' ? 'Admin' : 'User'}</span></td>
          `;
          tableBody.appendChild(row);
        });

        usersModal.classList.add('show');
      } catch (error) {
        console.error(error);
        alert('Error loading users list.');
      }
    });

    function closeUsersModal() {
      usersModal.classList.remove('show');
    }



    // Backup Generation (JSON Download)
    document.getElementById('createBackupBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(surveysList, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `surveys_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Dropdown toggle logic
    const profileMenuBtn = document.getElementById('profileMenuBtn');
    const profileDropdown = document.getElementById('profileDropdown');

    profileMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('show');
    });

    // Close dropdown on click outside
    document.addEventListener('click', (e) => {
      if (!profileDropdown.contains(e.target) && !profileMenuBtn.contains(e.target)) {
        profileDropdown.classList.remove('show');
      }
    });

    // Handle logout button click
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Do you want to log out?')) {
        sessionStorage.clear();
        window.location.href = 'login.html';
      }
    });

    // Helpers
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
