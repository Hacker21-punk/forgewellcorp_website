<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trueprogress by Forgewell Corporation</title>
  <meta name="description" content="Trueprogress Dashboard" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />
  <meta name="theme-color" content="#14124c" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/index.css" />
</head>
<body>
  <div class="dashboard-wrapper">
    <main class="dashboard-content">
      <div class="dashboard-container">
        <!-- Top Header Row -->
        <header class="header-row">
          <a href="https://forgewellcorp-website-dnhu.vercel.app/" class="logo-link">
            <span class="logo-wrapper">
              <span class="logo-sizer">
                <img
                  class="logo-img"
                  alt="Trueprogress"
                  src="assets/trueprogress_logo.png"
                />
              </span>
            </span>
          </a>

          <!-- Profile Menu Container -->
          <div class="profile-menu-container">
            <div class="profile-btn-wrapper" id="profileMenuBtn">
              <div class="profile-avatar-placeholder" id="profileInitial">A</div>
              <span class="profile-name" id="profileName">Admin</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>

            <!-- Profile Dropdown Card -->
            <div class="profile-dropdown" id="profileDropdown">
              <div class="profile-dropdown-name" id="dropdownName">Admin User</div>
              <div class="profile-dropdown-detail">
                <span class="detail-label">Phone</span>
                <span class="detail-value" id="dropdownPhone">N/A</span>
              </div>
              <div class="profile-dropdown-detail">
                <span class="detail-label">Email</span>
                <span class="detail-value" id="dropdownEmail">N/A</span>
              </div>
              <button class="profile-dropdown-logout-btn" id="logoutBtn">
                Logout
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
          <ul class="breadcrumb-list">
            <li class="breadcrumb-item">
              <svg aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
              </svg>
              Home
            </li>
          </ul>
        </nav>

        <!-- Table Card -->
        <div class="table-card">
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>
                    <div class="header-content">
                      Name
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path>
                      </svg>
                    </div>
                  </th>
                  <th>
                    <div class="header-content">
                      Department
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path>
                      </svg>
                    </div>
                  </th>
                  <th>
                    <div class="header-content">
                      Video Count
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path>
                      </svg>
                    </div>
                  </th>
                  <th>
                    <div class="header-content">
                      Survey Length
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path>
                      </svg>
                    </div>
                  </th>
                  <th>Created On</th>
                  <th>
                    <div class="header-content">
                      Status
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"></path>
                      </svg>
                    </div>
                  </th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- Dynamically populated from surveys.json -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
          <p class="footer-text">© 2023 Forgewell Corporation</p>
        </footer>
      </div>
    </main>
  </div>

  <script>
    // Verify session
    const userSession = sessionStorage.getItem('loggedInUser');
    if (!userSession) {
      window.location.href = 'login.html';
    } else {
      const user = JSON.parse(userSession);
      
      // Update UI Header details
      document.getElementById('profileName').innerText = user.name;
      document.getElementById('profileInitial').innerText = user.name.charAt(0).toUpperCase();

      // Update Dropdown details
      document.getElementById('dropdownName').innerText = user.name;
      document.getElementById('dropdownPhone').innerText = user.phoneNumber || 'N/A';
      document.getElementById('dropdownEmail').innerText = user.email || 'N/A';

      // Fetch and display surveys
      loadSurveys(user);
    }

    async function loadSurveys(user) {
      try {
        const response = await fetch('backup%20details%20of%20trueprogress/surveys.json');
        if (!response.ok) throw new Error('Failed to load surveys data');
        const surveys = await response.json();

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        // Filter surveys based on user access
        const allowedSurveys = surveys.filter(survey => {
          // If user is admin, allow all
          if (user.admin === "true") return true;
          // If user has wildcard access "*", allow all
          if (user.survey && user.survey.map(s => s.trim()).includes('*')) return true;
          // Otherwise check if the survey name is in the user's allowed list
          return user.survey && user.survey.map(s => s.trim().toLowerCase()).includes(survey.name.trim().toLowerCase());
        });

        if (allowedSurveys.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #9ca3af; padding: 2rem;">No authorized surveys found for your account.</td></tr>`;
          return;
        }

        allowedSurveys.forEach(survey => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${survey.name}</strong></td>
            <td>${survey.department}</td>
            <td>${survey.video_count || survey.total_surveys || 0}</td>
            <td>${survey.survey_length || 'N/A'}</td>
            <td>${survey.createdAt}</td>
            <td><span class="status-badge ${survey.status}">${survey.status}</span></td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error(error);
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red; padding: 2rem;">Error loading surveys data.</td></tr>`;
      }
    }

    // Dropdown toggle logic
    const profileMenuBtn = document.getElementById('profileMenuBtn');
    const profileDropdown = document.getElementById('profileDropdown');

    profileMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('show');
    });

    // Close dropdown on click outside
    document.addEventListener('click', (e) => {
      if (!profileDropdown.contains(e.target) && !profileMenuBtn.contains(e.target)) {
        profileDropdown.classList.remove('show');
      }
    });

    // Handle logout button click
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Do you want to log out?')) {
        sessionStorage.clear();
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
