<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trueprogress by Forgewell Corporation</title>
  <meta name="description" content="Trueprogress - Reset Password" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />
  <meta name="theme-color" content="#14124c" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      height: 100%;
      width: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.87);
      background-color: #fafbfb;
    }

    /* ===== Layout ===== */
    .reset-wrapper {
      min-height: 100vh;
      width: 100%;
      background-color: #60a5fa; /* Replicating the background color of login for consistency */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .reset-card {
      width: 100%;
      max-width: 28rem; /* sm:max-w-md */
      background-color: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      border: 1px solid #e5e7eb;
    }

    /* ===== Logo ===== */
    .reset-logo-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      text-decoration: none;
      color: #14124c;
      text-align: center;
      width: 100%;
    }

    .reset-logo-wrapper {
      display: inline-block;
      overflow: hidden;
      position: relative;
      max-width: 100%;
    }

    .reset-logo-sizer {
      display: block;
      width: 220px;
      height: 40px;
      max-width: 100%;
      background: none;
      opacity: 1;
      border: 0;
      margin: 0;
      padding: 0;
    }

    .reset-logo-img {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      box-sizing: border-box;
      padding: 0;
      border: none;
      margin: auto;
      display: block;
      width: 0;
      height: 0;
      min-width: 100%;
      max-width: 100%;
      min-height: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* ===== Heading ===== */
    .reset-heading {
      font-size: 1.5rem;
      line-height: 2rem;
      color: #1f2937; /* gray-900 */
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .reset-subheading {
      font-size: 0.875rem;
      color: #6b7280; /* gray-500 */
      margin-bottom: 1.5rem;
    }

    /* ===== Form Fields ===== */
    .reset-fields {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .reset-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151; /* gray-700 */
      margin-bottom: 0.5rem;
    }

    .reset-input {
      display: block;
      font-size: 0.875rem;
      line-height: 1.25rem;
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      width: 100%;
      border: 1px solid #d1d5db; /* gray-300 */
      outline: none;
      font-family: inherit;
      color: #1f2937;
      background-color: #f9fafb; /* gray-50 */
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .reset-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      background-color: #ffffff;
    }

    /* ===== Checkbox / Terms ===== */
    .reset-terms-row {
      display: flex;
      align-items: flex-start;
      margin-top: 1rem;
    }

    .reset-checkbox {
      width: 1rem;
      height: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.25rem;
      background-color: #f9fafb;
      cursor: pointer;
      margin-top: 0.125rem;
    }

    .reset-terms-text {
      font-size: 0.875rem;
      color: #6b7280;
      margin-left: 0.75rem;
      line-height: 1.25rem;
      font-weight: 300;
    }

    .reset-terms-text a {
      color: #2563eb;
      font-weight: 500;
    }

    .reset-terms-text a:hover {
      text-decoration: underline;
    }

    /* ===== Submit Button ===== */
    .reset-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.625rem 1.25rem;
      background-color: #ffffff;
      color: #14124c;
      border: 1px solid rgba(20, 18, 76, 0.5);
      font-weight: 500;
      font-size: 0.875rem;
      line-height: 1.75;
      border-radius: 0.25rem;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .reset-btn:hover {
      background-color: rgba(20, 18, 76, 0.02);
      border-color: #14124c;
    }

    /* ===== Back to Login Link ===== */
    .reset-back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #2563eb;
      font-weight: 500;
    }

    .reset-back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="reset-wrapper">
    <div class="reset-card">
      <!-- Logo -->
      <a href="https://forgewellcorp-website-dnhu.vercel.app/" class="reset-logo-link">
        <span class="reset-logo-wrapper">
          <span class="reset-logo-sizer">
            <img
              class="reset-logo-img"
              alt="Trueprogress"
              src="assets/trueprogress_logo.png"
            />
          </span>
        </span>
      </a>

      <!-- Heading -->
      <h2 class="reset-heading">Reset Password</h2>
      <p class="reset-subheading">Enter your email address and we'll send you an email with instructions to reset your password.</p>

      <!-- Form -->
      <form id="resetForm" onsubmit="return handleReset(event)">
        <div class="reset-fields">
          <div>
            <label for="email" class="reset-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="reset-input"
              required
              placeholder="name@company.com"
            />
          </div>

          <div class="reset-terms-row">
            <input
              type="checkbox"
              id="terms"
              class="reset-checkbox"
              required
            />
            <label for="terms" class="reset-terms-text">
              I accept the <a href="#">Terms and Conditions</a>
            </label>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="reset-btn">
          Send Reset Email
        </button>

        <!-- Back to Login -->
        <a href="login.html" class="reset-back-link">Back to login</a>
      </form>
    </div>
  </div>

  <script>
    function handleReset(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const termsAccepted = document.getElementById('terms').checked;

      if (!email) {
        alert('Please enter your email.');
        return false;
      }
      if (!termsAccepted) {
        alert('Please accept the terms and conditions.');
        return false;
      }

      console.log('Password reset requested for:', email);
      alert('Password reset link has been sent to your email.');
      window.location.href = 'login.html';
      return false;
    }
  </script>
</body>
</html>
